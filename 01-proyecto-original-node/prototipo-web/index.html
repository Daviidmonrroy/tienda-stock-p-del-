<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibra Deportiva · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#20242b;background:#f5f6f8;font-synthesis:none;--red:#eb433d;--ink:#20242b;--muted:#858b96;--line:#e9ebef;--green:#24966b}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:flex}.sidebar{width:248px;background:#171a20;color:#fff;padding:27px 17px;display:flex;flex-direction:column;flex-shrink:0}
.logo{font:800 18px Manrope,sans-serif;letter-spacing:-.6px;display:flex;align-items:center;gap:10px;padding:0 10px 34px}.logo-mark{width:31px;height:31px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:16px}
.group-label{font-size:10px;letter-spacing:1.35px;text-transform:uppercase;color:#767d88;padding:0 12px 11px;margin-top:8px}
.nav{display:grid;gap:5px}.nav button{border:0;background:none;color:#a6abb4;text-align:left;padding:11px 12px;border-radius:9px;font-size:13px;display:flex;align-items:center;gap:12px;transition:.18s}
.nav button:hover{color:white;background:#252932}.nav button.active{color:white;background:#2b2f38;font-weight:700}.nav .ico{width:18px;text-align:center;font-size:15px}
.side-bottom{margin-top:auto;border-top:1px solid #2a2e36;padding:17px 10px 0;color:#9da3ad;font-size:11px;line-height:1.7}
.main{flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 38px;position:sticky;top:0;z-index:2}
.breadcrumb{font-size:12px;color:var(--muted)}.breadcrumb strong{color:var(--ink);font-weight:700}.right-tools{display:flex;gap:12px;align-items:center}.today{font-size:12px;color:var(--muted);padding-right:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#fff0ef;color:var(--red);font-weight:700;font-size:12px}
.content{max-width:1440px;padding:32px 38px 50px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px;gap:20px}.eyebrow{font-size:11px;color:var(--red);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px}
h1{font:800 28px Manrope,sans-serif;letter-spacing:-1px;margin:0;color:#191d24}.subtitle{font-size:13px;color:var(--muted);margin:7px 0 0}.primary{background:var(--red);color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:12px;box-shadow:0 5px 12px #eb433d30}.primary:hover{background:#d93631}.secondary{background:#fff;color:#404650;border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-weight:600;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 19px;box-shadow:0 3px 12px #21263205}
.kpi-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7b818c}.kpi-icon{width:32px;height:32px;border-radius:9px;background:#fff1f0;color:var(--red);display:grid;place-items:center;font-size:15px}.kpi-value{font:800 25px Manrope,sans-serif;letter-spacing:-.7px;margin:14px 0 4px}.kpi-foot{font-size:10px;color:#8d939d}.up{color:var(--green);font-weight:700}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:17px}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card-title h2{font:700 14px Manrope,sans-serif;margin:0}.muted{font-size:11px;color:var(--muted)}
.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#969ca6;padding:10px 9px;border-bottom:1px solid var(--line)}td{font-size:11px;padding:12px 9px;border-bottom:1px solid #f0f1f3}tbody tr:last-child td{border-bottom:0}.product-cell{display:flex;align-items:center;gap:10px;font-weight:700}.thumb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#f1f3f6;font-size:16px}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:700}.tag.ok{background:#e8f6ef;color:#25845e}.tag.low{background:#fff0ed;color:#d7493e}.tag:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.activity{display:grid;gap:14px}.activity-item{display:flex;gap:10px;align-items:flex-start}.activity-dot{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#eff7f3;color:var(--green);display:grid;place-items:center;font-size:13px}.activity-copy{font-size:11px;line-height:1.45}.activity-copy strong{display:block;font-size:11px}.activity-copy span{color:var(--muted);font-size:10px}
.bar-chart{height:143px;display:flex;align-items:flex-end;gap:10px;padding:8px 4px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;display:flex;height:100%;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(25px,72%);border-radius:5px 5px 1px 1px;background:#f9aaa6}.bar.current{background:var(--red)}.bar-label{font-size:9px;color:#9298a2;padding-bottom:7px}.chart-foot{display:flex;justify-content:space-between;margin-top:12px;font-size:10px;color:var(--muted)}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}.search{position:relative;flex:1}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;outline:none}.search input:focus,input:focus,select:focus{border-color:#f08a86;box-shadow:0 0 0 3px #eb433d18;outline:none}.search:before{content:'⌕';position:absolute;left:12px;top:6px;font-size:19px;color:#9298a2}
.page-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px;flex:1;min-width:125px}.field label{font-size:10px;color:#78808b}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px}
.empty{text-align:center;padding:28px;color:#999;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#171a2077;z-index:8;display:grid;place-items:center;padding:18px}.modal{background:white;width:min(460px,100%);border-radius:14px;padding:23px;box-shadow:0 20px 70px #0003}.modal h2{font:800 19px Manrope;margin:0 0 5px}.modal p{font-size:12px;color:var(--muted);margin:0 0 18px}.modal-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.mobile-head{display:none}
@media(max-width:1000px){.sidebar{width:215px}.content{padding:26px 24px}.topbar{padding:0 24px}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.sidebar{width:auto;padding:12px 14px;display:block}.logo{padding:0 3px 12px}.group-label,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 10px}.nav .ico{display:none}.topbar{height:53px;padding:0 16px}.content{padding:22px 14px 36px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:24px}.grid{gap:9px}.card{padding:14px}.kpi-value{font-size:21px}.cols,.page-grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%}.today{display:none}}
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useMemo}=React;
const KEY='padel_stock_db_v1';
const seed=()=>({seq:{prod:7,cli:0,vend:0,venta:0,compra:0},categorias:[{id:1,nombre:'Paletas'},{id:2,nombre:'Indumentaria'},{id:3,nombre:'Accesorios'},{id:4,nombre:'Zapatillas'},{id:5,nombre:'Paleteros'},{id:6,nombre:'Tubos de pelotas'}],marcas:[{id:1,nombre:'Marca A'},{id:2,nombre:'Marca B'}],zonas:[{id:1,nombre:'Zona Norte'},{id:2,nombre:'Zona Sur'}],proveedores:[{id:1,nombre:'Distribuidora Pádel SA',telefono:''}],productos:[{id:1,categoria:1,marca:1,nombre:'Paleta Control 1',precio:150000,stock:10,stock_min:2,activo:true},{id:2,categoria:1,marca:2,nombre:'Paleta Power 1',precio:180000,stock:8,stock_min:2,activo:true},{id:3,categoria:2,marca:1,nombre:'Remera Deportiva',precio:45000,stock:20,stock_min:5,activo:true},{id:4,categoria:3,marca:2,nombre:'Overgrip',precio:8000,stock:50,stock_min:10,activo:true},{id:5,categoria:4,marca:1,nombre:'Zapatillas Court Pro',precio:95000,stock:12,stock_min:3,activo:true},{id:6,categoria:5,marca:2,nombre:'Paletero Tour',precio:70000,stock:6,stock_min:2,activo:true},{id:7,categoria:6,marca:1,nombre:'Tubo x3 Pelotas Pro',precio:9500,stock:40,stock_min:10,activo:true}],clientes:[],vendedores:[],ventas:[],compras:[]});
function readDB(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const icons={dashboard:'▦',productos:'▤',ventas:'↗',compras:'⇩',gente:'♙',catalogos:'◈',reportes:'▥'};
const labels={dashboard:'Resumen general',productos:'Productos',ventas:'Ventas',compras:'Compras',gente:'Clientes y vendedores',catalogos:'Catálogos',reportes:'Reportes'};
function App(){
 const [db,setDb]=useState(readDB),[page,setPage]=useState('dashboard'),[query,setQuery]=useState(''),[modal,setModal]=useState(false),[toast,setToast]=useState('');
 const [form,setForm]=useState({nombre:'',categoria:1,marca:1,precio:'',stock:0,stock_min:2});
 const persist=next=>{setDb(next);localStorage.setItem(KEY,JSON.stringify(next))};
 const low=db.productos.filter(p=>p.activo&&p.stock<=p.stock_min);
 const totalVentas=db.ventas.reduce((s,v)=>s+v.total,0);
 const activeProducts=db.productos.filter(p=>p.activo);
 const notify=t=>{setToast(t);setTimeout(()=>setToast(''),2300)};
 const addProduct=e=>{e.preventDefault();if(!form.nombre.trim())return;const next={...db,seq:{...db.seq,prod:(db.seq.prod||0)+1},productos:[...db.productos,{...form,id:(db.seq.prod||0)+1,categoria:Number(form.categoria),marca:Number(form.marca),precio:Number(form.precio)||0,stock:Number(form.stock)||0,stock_min:Number(form.stock_min)||0,activo:true}]};persist(next);setModal(false);setForm({nombre:'',categoria:1,marca:1,precio:'',stock:0,stock_min:2});notify('Producto agregado al catálogo')};
 const toggle=id=>persist({...db,productos:db.productos.map(p=>p.id===id?{...p,activo:!p.activo}:p)});
 const filtered=useMemo(()=>db.productos.filter(p=>(p.nombre+' '+(db.categorias.find(c=>c.id===p.categoria)?.nombre||'')).toLowerCase().includes(query.toLowerCase())),[db,query]);
 const title=labels[page];
 function Heading({eyebrow,subtitle,action}){return <div className="heading"><div><div className="eyebrow">{eyebrow}</div><h1>{title}</h1><p className="subtitle">{subtitle}</p></div>{action}</div>}
 function Dashboard(){return <><Heading eyebrow="VIBRA DEPORTIVA / PANEL" subtitle="Un vistazo rápido al movimiento de tu tienda." action={<button className="primary" onClick={()=>{setPage('productos');setModal(true)}}>＋ &nbsp;Agregar producto</button>}/><div className="grid">
 {[['Productos activos',activeProducts.length,'▤','En todo el catálogo'],['Unidades en stock',db.productos.reduce((s,p)=>s+Number(p.stock||0),0),'▦','Disponibles para vender'],['Stock bajo',low.length,'!','Revisar para reponer'],['Ventas históricas',money(totalVentas),'↗',db.ventas.length+' operaciones registradas']].map(([a,b,c,d],i)=><div className="card" key={a}><div className="kpi-head">{a}<span className="kpi-icon">{c}</span></div><div className="kpi-value" style={i===2&&low.length?{color:'var(--red)'}:{}}>{b}</div><div className="kpi-foot">{d}</div></div>)}
 </div><div className="cols"><div className="card"><div className="card-title"><h2>Inventario reciente</h2><button className="secondary" onClick={()=>setPage('productos')}>Ver catálogo</button></div><ProductTable items={db.productos.filter(p=>p.activo).slice(0,5)}/></div>
 <div style={{display:'grid',gap:15}}><div className="card"><div className="card-title"><h2>Actividad reciente</h2><span className="muted">Últimas operaciones</span></div><div className="activity">{db.ventas.slice(-4).reverse().map(v=><div className="activity-item" key={'v'+v.id}><div className="activity-dot">↗</div><div className="activity-copy"><strong>Venta #{v.id} · {money(v.total)}</strong><span>{new Date(v.fecha).toLocaleDateString('es-AR')}</span></div></div>)}{db.compras.slice(-3).reverse().map(v=><div className="activity-item" key={'c'+v.id}><div className="activity-dot" style={{background:'#fff4e9',color:'#c68228'}}>⇩</div><div className="activity-copy"><strong>Compra #{v.id} · {money(v.total)}</strong><span>{new Date(v.fecha).toLocaleDateString('es-AR')}</span></div></div>)}{!db.ventas.length&&!db.compras.length&&<div className="empty">Todavía no hay movimientos.<br/>Las ventas y compras aparecerán aquí.</div>}</div></div>
 <div className="card"><div className="card-title"><h2>Atención de stock</h2><span className="tag low">{low.length} alertas</span></div>{low.length?<div className="activity">{low.slice(0,4).map(p=><div className="activity-item" key={p.id}><div className="activity-dot" style={{background:'#fff0ed',color:'var(--red)'}}>!</div><div className="activity-copy"><strong>{p.nombre}</strong><span>{p.stock} unidades · mínimo {p.stock_min}</span></div></div>)}</div>:<div className="empty">Todo el inventario está por encima del mínimo.</div>}</div></div></div></>}
 function ProductTable({items}){return <div className="table-scroll"><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>{items.map(p=><tr key={p.id}><td><div className="product-cell"><span className="thumb">{p.categoria===1?'🎾':p.categoria===4?'👟':'◉'}</span><span>{p.nombre}<small style={{display:'block',color:'#999',fontWeight:400,marginTop:3}}>{db.categorias.find(c=>c.id===p.categoria)?.nombre||'Sin categoría'}</small></span></div></td><td>{money(p.precio)}</td><td>{p.stock} u.</td><td><span className={'tag '+(p.stock<=p.stock_min?'low':'ok')}>{p.stock<=p.stock_min?'Stock bajo':'Disponible'}</span></td><td><button className="secondary" onClick={()=>toggle(p.id)}>{p.activo?'Desactivar':'Activar'}</button></td></tr>)}{!items.length&&<tr><td colSpan="5" className="empty">No hay productos para mostrar.</td></tr>}</tbody></table></div>}
 function Products(){return <><Heading eyebrow="CATÁLOGO" subtitle="Administra productos, precios y disponibilidad." action={<button className="primary" onClick={()=>setModal(true)}>＋ &nbsp;Nuevo producto</button>}/><div className="card"><div className="toolbar"><div className="search"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar por nombre o categoría"/></div><span className="muted">{filtered.length} productos</span></div><ProductTable items={filtered}/></div></>}
 function SimplePage(){return <><Heading eyebrow="GESTIÓN" subtitle="Consulta la información registrada en el sistema."/><div className="page-grid">{page==='reportes'?<><div className="card"><div className="card-title"><h2>Stock bajo mínimo</h2><span className="tag low">{low.length} productos</span></div><ProductTable items={low}/></div><div className="card"><div className="card-title"><h2>Ventas y comisiones por vendedor</h2></div><div className="table-scroll"><table><thead><tr><th>Vendedor</th><th>Ventas</th><th>Comisión</th></tr></thead><tbody>{db.vendedores.map(v=>{const ventas=db.ventas.filter(x=>x.vendedor===v.id);return <tr key={v.id}><td>{v.nombre}</td><td>{money(ventas.reduce((s,x)=>s+x.total,0))}</td><td>{money(ventas.reduce((s,x)=>s+x.comision_monto,0))}</td></tr>})}</tbody></table></div></div></>:<><div className="card"><div className="card-title"><h2>{page==='ventas'?'Historial de ventas':page==='compras'?'Historial de compras':page==='gente'?'Clientes':'Zonas'}</h2><span className="muted">{page==='ventas'?db.ventas.length:page==='compras'?db.compras.length:page==='gente'?db.clientes.length:db.zonas.length} registros</span></div><div className="table-scroll"><table><thead><tr>{page==='ventas'?<><th>Operación</th><th>Fecha</th><th>Total</th><th>Comisión</th></>:page==='compras'?<><th>Operación</th><th>Fecha</th><th>Total</th></>:page==='gente'?<><th>Cliente</th><th>Teléfono</th></>:<><th>Zona</th></>}</tr></thead><tbody>{(page==='ventas'?db.ventas:page==='compras'?db.compras:page==='gente'?db.clientes:db.zonas).slice().reverse().map(x=><tr key={x.id}><td>{page==='ventas'?'Venta #'+x.id:page==='compras'?'Compra #'+x.id:x.nombre}</td>{page==='ventas'?<><td>{new Date(x.fecha).toLocaleDateString('es-AR')}</td><td>{money(x.total)}</td><td>{money(x.comision_monto)}</td></>:page==='compras'?<><td>{new Date(x.fecha).toLocaleDateString('es-AR')}</td><td>{money(x.total)}</td></>:page==='gente'?<td>{x.telefono||'—'}</td>:null}</tr>)}</tbody></table></div></div>
 <div className="card"><div className="card-title"><h2>{page==='ventas'?'Registrar venta':page==='compras'?'Registrar compra':page==='gente'?'Vendedores':'Proveedores'}</h2></div><p className="muted" style={{lineHeight:1.7}}>{page==='ventas'?'Las ventas se registran desde el flujo de caja del sistema.':page==='compras'?'Las compras actualizan las existencias del inventario.':page==='gente'?'El padrón de vendedores y clientes se conserva junto con tus datos locales.':'Los catálogos ayudan a organizar el inventario.'}</p>{page==='gente'&&db.vendedores.map(v=><div className="activity-item" key={v.id}><div className="activity-dot">♙</div><div className="activity-copy"><strong>{v.nombre}</strong><span>{db.zonas.find(z=>z.id===v.zona)?.nombre||'Sin zona'} · {v.comision}% comisión</span></div></div>)}</div></>}</div></>}
 return <div className="shell"><aside className="sidebar"><div className="logo"><span className="logo-mark">↗</span> VIBRA DEPORTIVA</div><div className="group-label">Espacio de trabajo</div><div className="nav">{Object.keys(labels).map(k=><button key={k} onClick={()=>setPage(k)} className={page===k?'active':''}><span className="ico">{icons[k]}</span>{labels[k]}</button>)}</div><div className="side-bottom">Sistema de gestión<br/>Stock y ventas · v1.0</div></aside><section className="main"><header className="topbar"><div className="breadcrumb">Vibra Deportiva&nbsp; / &nbsp;<strong>{title}</strong></div><div className="right-tools"><span className="today">{new Date().toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><span className="avatar">VD</span></div></header><main className="content">{page==='dashboard'?<Dashboard/>:page==='productos'?<Products/>:<SimplePage/>}</main></section>{modal&&<div className="modal-backdrop" onMouseDown={e=>e.target===e.currentTarget&&setModal(false)}><form className="modal" onSubmit={addProduct}><h2>Nuevo producto</h2><p>Completa los datos para sumar un artículo al catálogo.</p><div className="modal-fields"><div className="field" style={{gridColumn:'1/-1'}}><label>Nombre del producto</label><input autoFocus value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Ej. Paleta Control Pro" required/></div><div className="field"><label>Categoría</label><select value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})}>{db.categorias.map(c=><option value={c.id} key={c.id}>{c.nombre}</option>)}</select></div><div className="field"><label>Marca</label><select value={form.marca} onChange={e=>setForm({...form,marca:e.target.value})}>{db.marcas.map(c=><option value={c.id} key={c.id}>{c.nombre}</option>)}</select></div><div className="field"><label>Precio de venta</label><input type="number" min="0" value={form.precio} onChange={e=>setForm({...form,precio:e.target.value})}/></div><div className="field"><label>Stock inicial</label><input type="number" min="0" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})}/></div><div className="field"><label>Stock mínimo</label><input type="number" min="0" value={form.stock_min} onChange={e=>setForm({...form,stock_min:e.target.value})}/></div></div><div className="modal-actions"><button type="button" className="secondary" onClick={()=>setModal(false)}>Cancelar</button><button className="primary">Guardar producto</button></div></form></div>}{toast&&<div style={{position:'fixed',bottom:22,right:22,background:'#20242b',color:'#fff',padding:'12px 17px',borderRadius:9,fontSize:12,zIndex:10,boxShadow:'0 8px 24px #0003'}}>{toast}</div>}</div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
