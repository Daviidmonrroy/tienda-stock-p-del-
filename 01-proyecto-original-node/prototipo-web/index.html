<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibra Deportiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1015;--panel:#1b1f26;--ink:#f1eff0;--muted:#a8a2a7;--line:#30353d;--red:#f03a37;--red-hover:#d12e2b;--soft-red:#3c2425;--green:#7bd4a5;--soft-green:#20382f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:10px}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,system-ui,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#0b1015;border-bottom:1px solid #2a2f37}
.head-in{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;justify-content:center;align-items:center}
.brand{width:250px;height:auto;display:block}
nav{display:flex;justify-content:center;gap:2px;overflow-x:auto;max-width:1000px;margin:0 auto;background:#0b1015;padding:0 12px;border-top:1px solid #2a2f37;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#b9b4b8;padding:13px 16px;font-size:.9rem;white-space:nowrap;border-bottom:3px solid transparent}
nav button:hover{color:#fff;background:rgba(255,255,255,.045)}
nav button.active{color:#fff;border-bottom-color:var(--red);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:20px 20px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:17px;margin-bottom:16px}
.panel h2{font-size:1rem;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:135px}
label{font-size:.72rem;color:var(--muted)}
input,select{padding:10px 11px;border:1px solid #3a414c;border-radius:7px;background:#11161d;color:var(--ink);font-size:.84rem;min-width:0}
input:focus,select:focus{outline:2px solid #f03a3755;border-color:var(--red)}
.btn{background:var(--red-hover);color:#fff;border:1px solid transparent;padding:10px 15px;border-radius:8px;font-size:.82rem;font-weight:700;box-shadow:0 3px 10px #d12e2b2b;transition:.16s}
.btn:hover{background:#e8453f;transform:translateY(-1px);box-shadow:0 5px 14px #d12e2b40}
.btn.ghost{background:transparent;color:var(--ink);border-color:#515762;box-shadow:none}
.btn.ghost:hover{background:#292e36;border-color:#707784;transform:none}
.btn.toggle{background:#3c2425;color:#ff8982;border-color:#673332;padding:6px 10px;font-size:.73rem;box-shadow:none}
.btn.toggle:hover{background:var(--red-hover);color:#fff;border-color:var(--red-hover)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.35px}
.tablewrap{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid2 .panel{margin-bottom:0}
.stat{font-size:1.7rem;font-weight:800;letter-spacing:-.5px}
.statlabel{font-size:.76rem;color:var(--muted);margin-top:4px}
.small{font-size:.76rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;font-size:.72rem;background:#2b3038;color:#e4e1e3}
.pill.low{background:#482625;color:#ff8982}
.pill.good{background:#20382f;color:#83d7ac}
.detail-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.catcell{display:flex;align-items:center;gap:9px}
.ic{display:inline-flex;width:36px;height:36px;border-radius:9px;background:#0b1015;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:26px;height:26px}
a.link{display:inline-flex;color:#ff7a77;text-decoration:none;cursor:pointer;font-size:.75rem;font-weight:700;padding:5px 8px;border-radius:6px;background:#3c2425;border:1px solid #673332}
a.link:hover{background:#5b2a29}
.products-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px;align-items:start}
.products-layout>.panel{min-width:0}
.product-form{position:sticky;top:225px}
.product-form-fields{display:grid;gap:11px}
.product-form .field{min-width:0}
.product-form .field input,.product-form .field select{width:100%}
.product-form .btn{width:100%;margin-top:3px}
.catalog-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.catalog-search{flex:1;min-width:0;position:relative}
.catalog-search span{position:absolute;left:12px;top:5px;color:var(--muted);font-size:20px}
.catalog-search input{width:100%;padding:10px 12px 10px 34px;font-size:.8rem}
.catalog-count{flex-shrink:0;border:1px solid var(--line);background:#ffffff09;border-radius:20px;padding:7px 10px;color:var(--muted);font-size:.72rem}
.catalog-filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.filter-chip{border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--muted);padding:6px 10px;font-size:.68rem;transition:.16s}
.filter-chip:hover{border-color:var(--red);color:var(--ink)}
.filter-chip.active{background:#f03a3724;border-color:#f03a3788;color:#ff8982;font-weight:700}
.filter-chip.stock-filter{margin-left:auto}
.filter-chip.stock-filter span{display:inline-block;margin-left:4px;min-width:16px;text-align:center;border-radius:10px;background:#f03a372b;padding:1px 4px;color:#ff8982}
.product-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product-tile{min-width:0;border:1px solid var(--line);border-radius:10px;padding:13px;background:linear-gradient(145deg,#ffffff0b,#ffffff02);transition:transform .18s,border-color .18s,box-shadow .18s}
.product-tile:hover{transform:translateY(-2px);border-color:#f03a3788;box-shadow:0 7px 18px #0003}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:7px}
.tile-icon{width:38px;height:38px;border-radius:10px;background:#0b1015;display:grid;place-items:center}
.tile-icon .ic{width:38px;height:38px;margin:0}
.stock-status{display:inline-flex;align-items:center;gap:6px;font-size:.65rem;font-weight:700;padding:5px 8px;border-radius:20px}
.stock-status i,.product-state i{width:6px;height:6px;border-radius:50%;background:currentColor}
.stock-status{color:#7bd4a5;background:#20382f}
.stock-status.is-low{color:#ff8982;background:#482625}
.stock-status.is-none{color:#c4c6ca;background:#333841}
.tile-info{margin:12px 0 13px}.tile-category{font-size:.66rem;color:var(--muted)}
.tile-info h3{font-size:.9rem;line-height:1.3;margin:5px 0 0}
.tile-bottom{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile-price-label,.tile-stock span{display:block;font-size:.63rem;color:var(--muted)}
.tile-price{display:block;margin-top:3px;font-size:1rem}
.tile-stock{text-align:right}.tile-stock strong{display:block;font-size:.88rem}
.tile-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px}
.product-state{display:inline-flex;align-items:center;gap:5px;font-size:.65rem;font-weight:700;color:#80d4a8}
.product-state.inactive{color:var(--muted)}
.product-state.inactive i{background:var(--muted)}
.catalog-empty{grid-column:1/-1;padding:25px 12px;text-align:center;color:var(--muted);font-size:.8rem}
.sale-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.sale-entry{min-width:0;padding:4px}
.sale-cart{position:sticky;top:225px;background:#11161d;border:1px solid var(--line);border-radius:10px;padding:15px}
.cart-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cart-heading h3{font-size:.95rem;margin:0}
.cart-lines{min-height:100px}
.cart-empty{text-align:center;padding:22px 8px;color:var(--muted);font-size:.8rem;line-height:1.7}
.cart-item{display:grid;grid-template-columns:minmax(0,1fr) auto 26px;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-product{display:grid;gap:4px;min-width:0}.cart-product strong{font-size:.76rem;overflow:hidden;text-overflow:ellipsis}
.cart-product span{font-size:.68rem;color:var(--muted)}
.cart-price{font-size:.75rem;font-weight:700}
.cart-remove{background:none;border:0;border-radius:5px;color:#ff8982;font-size:1.15rem;padding:3px 7px}
.cart-remove:hover{background:#f03a3722}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-size:.82rem}
.cart-total strong{font-size:1.15rem}
.cart-submit{width:100%}
.purchase-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.purchase-cart{background:#11161d;border:1px solid var(--line);border-radius:10px;padding:15px}
.page-title{margin:0 0 15px;font-size:1.18rem}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:.78rem}
.toast{position:fixed;right:20px;bottom:20px;z-index:10;background:#252b33;border:1px solid #3c434e;color:var(--ink);padding:12px 16px;border-radius:9px;box-shadow:0 8px 25px #0005;font-size:.82rem}
@media(max-width:760px){.products-layout,.sale-layout,.purchase-layout{grid-template-columns:1fr}.product-form{position:static;order:-1}.sale-cart{position:static}.product-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.head-in{padding:12px}.brand{width:210px}nav{justify-content:flex-start}nav button{padding:11px 12px;font-size:.82rem}main{padding:15px 12px 40px}.grid2{grid-template-columns:1fr}.product-cards{grid-template-columns:1fr}.catalog-toolbar{align-items:stretch;flex-direction:column}.catalog-count{align-self:flex-start}.filter-chip.stock-filter{margin-left:0}.panel{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const KEY='padel_stock_db_v1';
const seed=()=>({seq:{cat:6,marca:2,zona:2,prov:1,prod:7,cli:0,vend:0,venta:0,compra:0},categorias:[{id:1,nombre:'Paletas'},{id:2,nombre:'Indumentaria'},{id:3,nombre:'Accesorios'},{id:4,nombre:'Zapatillas'},{id:5,nombre:'Paleteros'},{id:6,nombre:'Tubos de pelotas'}],marcas:[{id:1,nombre:'Marca A'},{id:2,nombre:'Marca B'}],zonas:[{id:1,nombre:'Zona Norte'},{id:2,nombre:'Zona Sur'}],proveedores:[{id:1,nombre:'Distribuidora Pádel SA',telefono:'',activo:true}],productos:[{id:1,categoria:1,marca:1,nombre:'Paleta Control 1',precio:150000,stock:10,stock_min:2,activo:true},{id:2,categoria:1,marca:2,nombre:'Paleta Power 1',precio:180000,stock:8,stock_min:2,activo:true},{id:3,categoria:2,marca:1,nombre:'Remera Deportiva',precio:45000,stock:20,stock_min:5,activo:true},{id:4,categoria:3,marca:2,nombre:'Overgrip',precio:8000,stock:50,stock_min:10,activo:true},{id:5,categoria:4,marca:1,nombre:'Zapatillas Court Pro',precio:95000,stock:12,stock_min:3,activo:true},{id:6,categoria:5,marca:2,nombre:'Paletero Tour',precio:70000,stock:6,stock_min:2,activo:true},{id:7,categoria:6,marca:1,nombre:'Tubo x3 Pelotas Pro',precio:9500,stock:40,stock_min:10,activo:true}],clientes:[],vendedores:[],ventas:[],compras:[]});
function initialDB(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const byId=(items,id)=>items.find(x=>x.id===Number(id));
const tabs=[['dashboard','Inicio'],['productos','Productos'],['ventas','Ventas'],['compras','Compras'],['gente','Clientes y vendedores'],['catalogos','Zonas y proveedores'],['reportes','Reportes']];
function categoryEmoji(name){const n=(name||'').toLowerCase();if(/paleta|pala/.test(n))return '🎾';if(/zapat/.test(n))return '👟';if(/ropa|remera|indument/.test(n))return '👕';if(/paletero|bolso/.test(n))return '🎒';return '🟡'}
function App(){
 const [db,setDb]=useState(initialDB),[page,setPage]=useState('dashboard'),[toast,setToast]=useState('');
 const [search,setSearch]=useState(''),[categoryFilter,setCategoryFilter]=useState('todos'),[lowOnly,setLowOnly]=useState(false);
 const [product,setProduct]=useState({nombre:'',categoria:'1',marca:'1',precio:'',stock:'0',stock_min:'0'});
 const [sale,setSale]=useState({vendedor:'',cliente:'',producto:'',cantidad:'1'}),[saleLines,setSaleLines]=useState([]);
 const [purchase,setPurchase]=useState({proveedor:'',producto:'',cantidad:'1',precio:''}),[purchaseLines,setPurchaseLines]=useState([]);
 const [clientForm,setClientForm]=useState({nombre:'',telefono:''});
 const [sellerForm,setSellerForm]=useState({nombre:'',zona:'1',comision:'10'});
 const persist=next=>{setDb(next);try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){console.error(e)}};
 const notify=text=>{setToast(text);window.setTimeout(()=>setToast(''),2600)};
 const nextId=kind=>(db.seq[kind]||0)+1;
 const low=db.productos.filter(p=>p.activo&&p.stock<=p.stock_min);
 const totalUnits=db.productos.reduce((s,p)=>s+Number(p.stock||0),0);
 const nextSeq=(kind)=>({...db.seq,[kind]:nextId(kind)});
 const addProduct=e=>{e.preventDefault();if(!product.nombre.trim()){notify('Escribí el nombre del producto');return}const id=nextId('prod');persist({...db,seq:nextSeq('prod'),productos:[...db.productos,{id,nombre:product.nombre.trim(),categoria:Number(product.categoria),marca:Number(product.marca),precio:Number(product.precio)||0,stock:Number(product.stock)||0,stock_min:Number(product.stock_min)||0,activo:true}]});setProduct({nombre:'',categoria:'1',marca:'1',precio:'',stock:'0',stock_min:'0'});notify('Producto agregado al catálogo')};
 const toggleProduct=id=>persist({...db,productos:db.productos.map(p=>p.id===id?{...p,activo:!p.activo}:p)});
 const addSaleLine=()=>{const p=byId(db.productos,sale.producto),qty=Number(sale.cantidad);if(!byId(db.vendedores,sale.vendedor)){notify('Cargá un vendedor antes de registrar una venta');return}if(!p||qty<1){notify('Elegí un producto y una cantidad válida');return}const already=saleLines.filter(l=>l.producto===p.id).reduce((s,l)=>s+l.cantidad,0);if(already+qty>p.stock){notify('No hay stock suficiente de '+p.nombre);return}setSaleLines([...saleLines,{producto:p.id,cantidad:qty}])};
 const removeSaleLine=i=>setSaleLines(saleLines.filter((_,n)=>n!==i));
 const confirmSale=()=>{const vendor=byId(db.vendedores,sale.vendedor);if(!vendor){notify('Cargá un vendedor antes de registrar la venta');return}if(!saleLines.length){notify('Agregá al menos un producto al carrito');return}const detail=saleLines.map(l=>{const p=byId(db.productos,l.producto);return{producto:p.id,cantidad:l.cantidad,precio_unitario:p.precio,subtotal:p.precio*l.cantidad}});const total=detail.reduce((s,d)=>s+d.subtotal,0),commission=Math.round(total*(Number(vendor.comision||0)/100)),id=nextId('venta');persist({...db,seq:nextSeq('venta'),productos:db.productos.map(p=>{const amount=saleLines.filter(l=>l.producto===p.id).reduce((s,l)=>s+l.cantidad,0);return amount?{...p,stock:p.stock-amount}:p}),ventas:[...db.ventas,{id,vendedor:vendor.id,cliente:sale.cliente?Number(sale.cliente):null,fecha:new Date().toISOString(),detalle,total,comision_pct:Number(vendor.comision||0),comision_monto:commission}]});setSaleLines([]);setSale({...sale,cliente:''});notify('Venta registrada correctamente')};
 const addPurchaseLine=()=>{const p=byId(db.productos,purchase.producto),qty=Number(purchase.cantidad),price=Number(purchase.precio)||0;if(!byId(db.proveedores,purchase.proveedor)){notify('Cargá un proveedor antes de registrar la compra');return}if(!p||qty<1){notify('Elegí un producto y cantidad válida');return}setPurchaseLines([...purchaseLines,{producto:p.id,cantidad:qty,precio:price}])};
 const removePurchaseLine=i=>setPurchaseLines(purchaseLines.filter((_,n)=>n!==i));
 const confirmPurchase=()=>{if(!byId(db.proveedores,purchase.proveedor)){notify('Cargá un proveedor antes de registrar la compra');return}if(!purchaseLines.length){notify('Agregá al menos un producto a la compra');return}const details=purchaseLines.map(l=>({producto:l.producto,cantidad:l.cantidad,precio_unitario:l.precio,subtotal:l.precio*l.cantidad})),total=details.reduce((s,d)=>s+d.subtotal,0),id=nextId('compra');persist({...db,seq:nextSeq('compra'),productos:db.productos.map(p=>{const amount=purchaseLines.filter(l=>l.producto===p.id).reduce((s,l)=>s+l.cantidad,0);return amount?{...p,stock:p.stock+amount}:p}),compras:[...db.compras,{id,proveedor:Number(purchase.proveedor),fecha:new Date().toISOString(),detalle:details,total}]});setPurchaseLines([]);notify('Compra registrada y stock actualizado')};
 const addPerson=(type,e)=>{e.preventDefault();const isClient=type==='cliente',form=isClient?clientForm:sellerForm;if(!form.nombre.trim()){notify('Escribí el nombre');return}const key=isClient?'cli':'vend',list=isClient?'clientes':'vendedores',record=isClient?{id:nextId(key),nombre:form.nombre.trim(),telefono:form.telefono.trim()}:{id:nextId(key),nombre:form.nombre.trim(),zona:Number(form.zona),comision:Number(form.comision)||0};persist({...db,seq:nextSeq(key),[list]:[...db[list],record]});if(isClient)setClientForm({nombre:'',telefono:''});else setSellerForm({...sellerForm,nombre:''});notify(isClient?'Cliente agregado':'Vendedor agregado')};
 const addCatalog=(key,seq,withPhone,e)=>{e.preventDefault();const data=new FormData(e.currentTarget),nombre=String(data.get('nombre')||'').trim(),telefono=String(data.get('telefono')||'').trim();if(!nombre){notify('Escribí un nombre');return}const id=nextId(seq),record={id,nombre};if(withPhone)record.telefono=telefono;persist({...db,seq:nextSeq(seq),[key]:[...db[key],record]});e.currentTarget.reset();notify('Registro agregado')};
 const setFilter=val=>{setCategoryFilter(val)};
 const filteredProducts=db.productos.filter(p=>{const c=byId(db.categorias,p.categoria);return(p.nombre+' '+(c?c.nombre:'')+' '+(byId(db.marcas,p.marca)?.nombre||'')).toLowerCase().includes(search.toLowerCase())&&(categoryFilter==='todos'||String(p.categoria)===String(categoryFilter))&&(!lowOnly||p.stock<=p.stock_min)});
 const PageTitle=({title,subtitle})=><><h1 className="page-title">{title}</h1>{subtitle&&<p className="small" style={{marginTop:-7,marginBottom:15}}>{subtitle}</p>}</>;
 const ProductCard=({p})=>{const c=byId(db.categorias,p.categoria),b=byId(db.marcas,p.marca),lowStock=p.stock<=p.stock_min,none=p.stock<=0;return <article className="product-tile"><div className="tile-top"><div className="tile-icon"><span aria-hidden="true" style={{fontSize:22}}>{categoryEmoji(c?.nombre)}</span></div><span className={'stock-status '+(none?'is-none':lowStock?'is-low':'')}><i/>{none?'Sin unidades':lowStock?'Stock bajo':'Stock suficiente'}</span></div><div className="tile-info"><span className="tile-category">{c?.nombre||'Sin categoría'} · {b?.nombre||'Sin marca'}</span><h3>{p.nombre}</h3></div><div className="tile-bottom"><div><span className="tile-price-label">Precio de venta</span><strong className="tile-price">{money(p.precio)}</strong></div><div className="tile-stock"><strong>{p.stock}</strong><span>unidades</span></div></div><div className="tile-actions"><span className={'product-state '+(p.activo?'active':'inactive')}><i/>{p.activo?'Activo':'Inactivo'}</span><button className="btn toggle" type="button" onClick={()=>toggleProduct(p.id)}>{p.activo?'Desactivar':'Activar'}</button></div></article>};
 const Products=()=>{const visible=db.productos.filter(p=>p.nombre.toLowerCase().includes(search.toLowerCase())&&(categoryFilter==='todos'||String(p.categoria)===String(categoryFilter))&&(!lowOnly||p.stock<=p.stock_min));return <div className="products-layout"><section className="panel"><h2>Catálogo</h2><div className="catalog-toolbar"><label className="catalog-search"><span aria-hidden="true">⌕</span><input value={search} onChange={e=>setSearch(e.target.value)} type="search" placeholder="Buscar producto, categoría o marca…"/></label><span className="catalog-count">{visible.length} de {db.productos.length}</span></div><div className="catalog-filters"><button className={'filter-chip '+(categoryFilter==='todos'?'active':'')} onClick={()=>setFilter('todos')}>Todos</button>{db.categorias.map(c=><button key={c.id} className={'filter-chip '+(String(categoryFilter)===String(c.id)?'active':'')} onClick={()=>setFilter(String(c.id))}>{c.nombre}</button>)}<button className={'filter-chip stock-filter '+(lowOnly?'active':'')} onClick={()=>setLowOnly(!lowOnly)}>Stock bajo <span>{low.length}</span></button></div><div className="product-cards">{visible.map(p=><ProductCard key={p.id} p={p}/>)}{!visible.length&&<div className="catalog-empty">No hay productos que coincidan con esos filtros.</div>}</div></section><section className="panel product-form"><h2>Nuevo producto</h2><p className="small" style={{margin:'0 0 14px'}}>Sumá un artículo al catálogo.</p><form className="product-form-fields" onSubmit={addProduct}><div className="field"><label>Nombre</label><input value={product.nombre} onChange={e=>setProduct({...product,nombre:e.target.value})} placeholder="Ej. Paleta Control Pro" required/></div><div className="field"><label>Categoría</label><select value={product.categoria} onChange={e=>setProduct({...product,categoria:e.target.value})}>{db.categorias.map(c=><option value={c.id} key={c.id}>{c.nombre}</option>)}</select></div><div className="field"><label>Marca</label><select value={product.marca} onChange={e=>setProduct({...product,marca:e.target.value})}>{db.marcas.map(c=><option value={c.id} key={c.id}>{c.nombre}</option>)}</select></div><div className="field"><label>Precio de venta</label><input type="number" min="0" value={product.precio} onChange={e=>setProduct({...product,precio:e.target.value})} placeholder="0"/></div><div className="field"><label>Stock inicial</label><input type="number" min="0" value={product.stock} onChange={e=>setProduct({...product,stock:e.target.value})}/></div><div className="field"><label>Stock mínimo</label><input type="number" min="0" value={product.stock_min} onChange={e=>setProduct({...product,stock_min:e.target.value})}/></div><button className="btn">Agregar producto</button></form></section></div>};
 const Dashboard=()=>{const sold=db.ventas.reduce((s,v)=>s+v.total,0),com=db.ventas.reduce((s,v)=>s+v.comision_monto,0);return <><div className="grid2">{[[db.productos.filter(p=>p.activo).length,'Productos activos'],[low.length,'Con stock bajo'],[money(sold),'Total vendido (histórico)'],[money(com),'Comisiones generadas']].map(([v,l])=><section className="panel" key={l}><div className="stat">{v}</div><div className="statlabel">{l}</div></section>)}</div><section className="panel"><h2>Últimas ventas</h2><div className="tablewrap"><table><thead><tr><th>Venta</th><th>Vendedor</th><th>Cliente</th><th>Total</th></tr></thead><tbody>{db.ventas.slice(-5).reverse().map(v=><tr key={v.id}><td>#{v.id}</td><td>{byId(db.vendedores,v.vendedor)?.nombre||'-'}</td><td>{byId(db.clientes,v.cliente)?.nombre||'Consumidor final'}</td><td>{money(v.total)}</td></tr>)}{!db.ventas.length&&<tr><td colSpan="4" className="small">Todavía no hay ventas registradas.</td></tr>}</tbody></table></div></section></>};
 const Sales=()=>{const total=saleLines.reduce((s,l)=>s+byId(db.productos,l.producto).precio*l.cantidad,0),count=saleLines.reduce((s,l)=>s+l.cantidad,0);return <><PageTitle title="Ventas" subtitle="Registrá una venta y descontá el stock automáticamente."/><section className="panel"><h2>Registrar venta</h2><div className="sale-layout"><div className="sale-entry"><div className="row"><div className="field"><label>Vendedor</label><select value={sale.vendedor} onChange={e=>setSale({...sale,vendedor:e.target.value})}><option value="">Seleccionar vendedor</option>{db.vendedores.map(v=><option key={v.id} value={v.id}>{v.nombre}</option>)}</select></div><div className="field"><label>Cliente (opcional)</label><select value={sale.cliente} onChange={e=>setSale({...sale,cliente:e.target.value})}><option value="">Consumidor final</option>{db.clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select></div></div><div className="row" style={{marginTop:16}}><div className="field"><label>Producto</label><select value={sale.producto} onChange={e=>setSale({...sale,producto:e.target.value})}><option value="">Seleccionar producto</option>{db.productos.filter(p=>p.activo).map(p=><option key={p.id} value={p.id}>{p.nombre} · {p.stock} u.</option>)}</select></div><div className="field" style={{maxWidth:130}}><label>Cantidad</label><input type="number" min="1" value={sale.cantidad} onChange={e=>setSale({...sale,cantidad:e.target.value})}/></div><button className="btn ghost" onClick={addSaleLine}>＋ Agregar producto</button></div><p className="small" style={{marginTop:18}}>El stock se descuenta al confirmar la venta.</p></div><aside className="sale-cart"><div className="cart-heading"><h3>Tu carrito</h3><span className="pill">{count} {count===1?'producto':'productos'}</span></div><div className="cart-lines">{saleLines.length?saleLines.map((l,i)=>{const p=byId(db.productos,l.producto);return <div className="cart-item" key={i}><div className="cart-product"><strong>{p.nombre}</strong><span>{l.cantidad} × {money(p.precio)}</span></div><span className="cart-price">{money(p.precio*l.cantidad)}</span><button className="cart-remove" aria-label={'Quitar '+p.nombre} onClick={()=>removeSaleLine(i)}>×</button></div>}):<div className="cart-empty">Tu carrito está vacío.<br/><span>Agregá productos para comenzar.</span></div>}</div><div className="cart-total"><span>Total</span><strong>{money(total)}</strong></div><button className="btn cart-submit" onClick={confirmSale}>Registrar venta</button></aside></div></section><section className="panel"><h2>Historial de ventas</h2><div className="tablewrap"><table><thead><tr><th>#</th><th>Vendedor</th><th>Cliente</th><th>Total</th><th>Comisión</th></tr></thead><tbody>{db.ventas.slice().reverse().map(v=><tr key={v.id}><td>{v.id}</td><td>{byId(db.vendedores,v.vendedor)?.nombre||'-'}</td><td>{byId(db.clientes,v.cliente)?.nombre||'Consumidor final'}</td><td>{money(v.total)}</td><td>{money(v.comision_monto)}</td></tr>)}{!db.ventas.length&&<tr><td colSpan="5" className="small">Sin ventas.</td></tr>}</tbody></table></div></section></>};
 const Purchases=()=>{const total=purchaseLines.reduce((s,l)=>s+l.precio*l.cantidad,0);return <><PageTitle title="Compras" subtitle="Registrá ingresos de mercadería para actualizar el inventario."/><section className="panel"><h2>Registrar compra</h2><div className="purchase-layout"><div><div className="field" style={{marginBottom:14}}><label>Proveedor</label><select value={purchase.proveedor} onChange={e=>setPurchase({...purchase,proveedor:e.target.value})}><option value="">Seleccionar proveedor</option>{db.proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select></div><div className="row"><div className="field"><label>Producto</label><select value={purchase.producto} onChange={e=>setPurchase({...purchase,producto:e.target.value})}><option value="">Seleccionar producto</option>{db.productos.map(p=><option value={p.id} key={p.id}>{p.nombre}</option>)}</select></div><div className="field"><label>Cantidad</label><input type="number" min="1" value={purchase.cantidad} onChange={e=>setPurchase({...purchase,cantidad:e.target.value})}/></div><div className="field"><label>Precio unitario</label><input type="number" min="0" value={purchase.precio} onChange={e=>setPurchase({...purchase,precio:e.target.value})}/></div><button className="btn ghost" onClick={addPurchaseLine}>＋ Agregar producto</button></div></div><aside className="purchase-cart"><h3 style={{margin:'0 0 12px',fontSize:'.9rem'}}>Detalle de compra</h3>{purchaseLines.length?purchaseLines.map((l,i)=><div className="cart-item" key={i}><div className="cart-product"><strong>{byId(db.productos,l.producto).nombre}</strong><span>{l.cantidad} × {money(l.precio)}</span></div><span className="cart-price">{money(l.cantidad*l.precio)}</span><button className="cart-remove" onClick={()=>removePurchaseLine(i)}>×</button></div>):<div className="cart-empty">Todavía no agregaste productos.</div>}<div className="cart-total"><span>Total</span><strong>{money(total)}</strong></div><button className="btn cart-submit" onClick={confirmPurchase}>Registrar compra</button></aside></div></section><section className="panel"><h2>Historial de compras</h2><div className="tablewrap"><table><thead><tr><th>#</th><th>Proveedor</th><th>Total</th></tr></thead><tbody>{db.compras.slice().reverse().map(c=><tr key={c.id}><td>{c.id}</td><td>{byId(db.proveedores,c.proveedor)?.nombre||'-'}</td><td>{money(c.total)}</td></tr>)}{!db.compras.length&&<tr><td colSpan="3" className="small">Sin compras.</td></tr>}</tbody></table></div></section></>};
 const People=()=>{const submit=(type,e)=>addPerson(type,e);return <><PageTitle title="Clientes y vendedores" subtitle="Gestioná los contactos de tu tienda."/><div className="grid2"><section className="panel"><h2>Nuevo cliente</h2><form className="row" onSubmit={e=>submit('cliente',e)}><div className="field"><label>Nombre y apellido</label><input value={clientForm.nombre} onChange={e=>setClientForm({...clientForm,nombre:e.target.value})} required/></div><div className="field"><label>Teléfono</label><input value={clientForm.telefono} onChange={e=>setClientForm({...clientForm,telefono:e.target.value})}/></div><button className="btn">Agregar</button></form></section><section className="panel"><h2>Nuevo vendedor</h2><form className="row" onSubmit={e=>submit('vendedor',e)}><div className="field"><label>Nombre y apellido</label><input value={sellerForm.nombre} onChange={e=>setSellerForm({...sellerForm,nombre:e.target.value})} required/></div><div className="field"><label>Zona</label><select value={sellerForm.zona} onChange={e=>setSellerForm({...sellerForm,zona:e.target.value})}>{db.zonas.map(z=><option value={z.id} key={z.id}>{z.nombre}</option>)}</select></div><div className="field"><label>% Comisión</label><input type="number" min="0" max="100" value={sellerForm.comision} onChange={e=>setSellerForm({...sellerForm,comision:e.target.value})}/></div><button className="btn">Agregar</button></form></section><section className="panel"><h2>Clientes</h2><div className="tablewrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th></tr></thead><tbody>{db.clientes.map(c=><tr key={c.id}><td>{c.nombre}</td><td>{c.telefono||'—'}</td></tr>)}{!db.clientes.length&&<tr><td colSpan="2" className="small">Sin clientes cargados.</td></tr>}</tbody></table></div></section><section className="panel"><h2>Vendedores</h2><div className="tablewrap"><table><thead><tr><th>Nombre</th><th>Zona</th><th>Comisión</th></tr></thead><tbody>{db.vendedores.map(v=><tr key={v.id}><td>{v.nombre}</td><td>{byId(db.zonas,v.zona)?.nombre||'—'}</td><td>{v.comision}%</td></tr>)}{!db.vendedores.length&&<tr><td colSpan="3" className="small">Sin vendedores cargados.</td></tr>}</tbody></table></div></section></div></>};
 const Catalogs=()=>{const blocks=[['Zonas','zonas','zona',false],['Proveedores','proveedores','prov',true],['Categorías','categorias','cat',false],['Marcas','marcas','marca',false]];return <><PageTitle title="Zonas y proveedores" subtitle="Organizá las listas que usa el catálogo."/><div className="grid2">{blocks.map(([title,key,seq,phone])=><section className="panel" key={key}><h2>{title}</h2><form className="row" onSubmit={e=>addCatalog(key,seq,phone,e)}><div className="field"><label>Nombre</label><input name="nombre" required/></div>{phone&&<div className="field"><label>Teléfono</label><input name="telefono"/></div>}<button className="btn">Agregar</button></form><div className="tablewrap" style={{marginTop:12}}><table><thead><tr><th>{title}</th>{phone&&<th>Teléfono</th>}</tr></thead><tbody>{db[key].map(x=><tr key={x.id}><td>{x.nombre}</td>{phone&&<td>{x.telefono||'—'}</td>}</tr>)}</tbody></table></div></section>)}</div></>};
 const Reports=()=>{const bySeller=db.vendedores.map(v=>{const sales=db.ventas.filter(x=>x.vendedor===v.id);return{...v,total:sales.reduce((s,x)=>s+x.total,0),commission:sales.reduce((s,x)=>s+x.comision_monto,0)}});const units={};db.ventas.forEach(v=>v.detalle.forEach(d=>units[d.producto]=(units[d.producto]||0)+d.cantidad));const ranking=Object.entries(units).sort((a,b)=>b[1]-a[1]);return <><PageTitle title="Reportes" subtitle="Un resumen rápido para tomar decisiones."/><section className="panel"><h2>Stock bajo mínimo</h2><div className="tablewrap"><table><thead><tr><th>Producto</th><th>Stock</th><th>Mínimo</th></tr></thead><tbody>{low.map(p=><tr key={p.id}><td>{p.nombre}</td><td><span className="pill low">{p.stock}</span></td><td>{p.stock_min}</td></tr>)}{!low.length&&<tr><td colSpan="3" className="small">Ningún producto por debajo del mínimo.</td></tr>}</tbody></table></div></section><section className="panel"><h2>Ventas y comisiones por vendedor</h2><div className="tablewrap"><table><thead><tr><th>Vendedor</th><th>Total vendido</th><th>Comisión</th></tr></thead><tbody>{bySeller.map(v=><tr key={v.id}><td>{v.nombre}</td><td>{money(v.total)}</td><td>{money(v.commission)}</td></tr>)}{!bySeller.length&&<tr><td colSpan="3" className="small">Sin vendedores.</td></tr>}</tbody></table></div></section><section className="panel"><h2>Productos más vendidos</h2><div className="tablewrap"><table><thead><tr><th>Producto</th><th>Unidades vendidas</th></tr></thead><tbody>{ranking.map(([id,qty])=><tr key={id}><td>{byId(db.productos,id)?.nombre||'—'}</td><td>{qty}</td></tr>)}{!ranking.length&&<tr><td colSpan="2" className="small">Sin ventas registradas.</td></tr>}</tbody></table></div></section></>};
 let view=page==='dashboard'?Dashboard():page==='productos'?Products():page==='ventas'?Sales():page==='compras'?Purchases():page==='gente'?People():page==='catalogos'?Catalogs():Reports();
 return <><header><div className="head-in"><svg className="brand" role="img" aria-label="Vibra Deportiva" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573.55 142"><path d="M0 0 C52 0 88 38 88 94 C88 146 56 186 26 210 L12 244 L12 304 Q12 314 0 314 Q-12 314 -12 304 L-12 244 L-26 210 C-56 186 -88 146 -88 94 C-88 38 -52 0 0 0 Z M-9 220 L9 220 L0 240 Z M-6.5 172 a6.5 6.5 0 1 0 13 0 a6.5 6.5 0 1 0 -13 0 Z M-20.75 146 a7.25 7.25 0 1 0 14.5 0 a7.25 7.25 0 1 0 -14.5 0 Z M-35 120 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z M-49.25 94 a8.75 8.75 0 1 0 17.5 0 a8.75 8.75 0 1 0 -17.5 0 Z M-63.5 68 a9.5 9.5 0 1 0 19 0 a9.5 9.5 0 1 0 -19 0 Z M6.25 146 a7.25 7.25 0 1 0 14.5 0 a7.25 7.25 0 1 0 -14.5 0 Z M19 120 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z M31.75 94 a8.75 8.75 0 1 0 17.5 0 a8.75 8.75 0 1 0 -17.5 0 Z M44.5 68 a9.5 9.5 0 1 0 19 0 a9.5 9.5 0 1 0 -19 0 Z" fill="#F03A37" fill-rule="evenodd" transform="translate(39,2) scale(.43)"/><text x="113" y="58" fill="#fff" fontFamily="Arial" fontSize="58" letterSpacing="5">VIBRA</text><text x="112" y="120" fill="#fff" fontFamily="Arial" fontWeight="bold" fontSize="53">DEPORTIVA</text></svg></div><nav>{tabs.map(([id,label])=><button key={id} className={page===id?'active':''} onClick={()=>setPage(id)}>{label}</button>)}</nav></header><main>{view}</main>{toast&&<div className="toast" role="status">{toast}</div>}</>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
