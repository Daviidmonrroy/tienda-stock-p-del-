<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibra Deportiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: encabezado negro con el logotipo; contenido en tarjetas. Identidad Vibra Deportiva: rojo impacto, negro cancha, gris pala. */
:root{
  --bg:#F3F1F2; --panel:#FFFFFF; --ink:#0B1015; --muted:#5B575C; --line:#DDD9DC;
  --court:#D12E2B; --court-hover:#B02522; --link:#D12E2B;
  --head:#0B1015; --head-ink:#FFFFFF; --head-muted:#B9B4B8; --head-line:#2A2F37;
  --accent:#F03A37; --danger:#D12E2B; --danger-ink:#D12E2B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1015; --panel:#1B1F26; --ink:#F1EFF0; --muted:#A8A2A7; --line:#2A2F37;
    --court-hover:#E8453F; --link:#FF7A77; --danger-ink:#FF7A77; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1015; --panel:#1B1F26; --ink:#F1EFF0; --muted:#A8A2A7; --line:#2A2F37;
  --court-hover:#E8453F; --link:#FF7A77; --danger-ink:#FF7A77; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--head);color:var(--head-ink);z-index:5;border-bottom:1px solid var(--head-line)}
.head-in{max-width:1000px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;justify-content:center;gap:10px 22px;flex-wrap:wrap}
.brand{width:250px;height:auto;flex-shrink:0;display:block}
.sub{font-size:.8rem;color:var(--head-muted)}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1000px;margin:0 auto;background:var(--head);padding:0 12px;border-top:1px solid var(--head-line);-ms-overflow-style:none;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;color:var(--head-muted);padding:11px 14px;font-size:.86rem;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.active{color:#fff;border-bottom-color:var(--accent);font-weight:600}
@media(max-width:480px){.brand{width:210px}}
main{max-width:1000px;margin:0 auto;padding:20px;padding-bottom:60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.72rem;color:var(--muted)}
input,select{padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-size:.88rem}
button.btn{background:var(--court);color:#fff;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:.85rem;font-weight:600}
button.btn:hover{background:var(--court-hover)}
button.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
button.btn.danger{background:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.3px}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;background:var(--line)}
.pill.low{background:var(--danger);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid2 .panel{margin-bottom:0}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.stat{font-size:1.7rem;font-weight:700}
.statlabel{font-size:.75rem;color:var(--muted)}
.detail-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.small{font-size:.78rem;color:var(--muted)}
.catcell{display:flex;align-items:center;gap:10px}
.ic{display:inline-flex;width:36px;height:36px;border-radius:9px;background:var(--head);align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:26px;height:26px;display:block}
a.link{color:var(--link);cursor:pointer;font-size:.8rem}

/* Botones: más claros y consistentes, conservando el diseño original */
button.btn{border-radius:8px;padding:10px 17px;box-shadow:0 3px 10px rgba(209,46,43,.18);transition:background .18s ease,transform .18s ease,box-shadow .18s ease}
button.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(209,46,43,.25)}
button.btn:active{transform:translateY(0)}
button.btn:focus-visible,nav button:focus-visible,a.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.btn.ghost{box-shadow:none}
a.link{display:inline-flex;align-items:center;text-decoration:none;padding:6px 10px;border:1px solid rgba(240,58,55,.35);border-radius:6px;background:rgba(240,58,55,.1);font-weight:600;transition:background .18s ease,border-color .18s ease}
a.link:hover{background:rgba(240,58,55,.2);border-color:var(--accent)}


button.btn.toggle{background:transparent;color:var(--link);border:1px solid rgba(240,58,55,.4);padding:6px 11px;font-size:.78rem;box-shadow:none}
button.btn.toggle:hover{background:var(--court);color:#fff;border-color:var(--court);box-shadow:0 4px 12px rgba(209,46,43,.2)}
nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav button.active{color:#fff;border-bottom-color:var(--accent)}


.sale-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
.sale-entry{min-width:0;padding:4px}
.sale-cart{position:sticky;top:230px;background:rgba(11,16,21,.28);border:1px solid var(--line);border-radius:10px;padding:16px}
.cart-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.cart-heading h3{font-size:.95rem;margin:0}
.cart-lines{min-height:104px}
.cart-empty{text-align:center;padding:25px 8px;color:var(--muted);font-size:.82rem;line-height:1.7}
.cart-empty span{font-size:.72rem}
.cart-item{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.cart-product{display:grid;gap:4px;min-width:0}
.cart-product strong{font-size:.78rem;overflow:hidden;text-overflow:ellipsis}
.cart-product span{font-size:.69rem;color:var(--muted)}
.cart-price{font-size:.78rem;font-weight:700}
.cart-remove{background:none;border:0;border-radius:5px;color:var(--danger-ink);font-size:1.15rem;padding:3px 7px}
.cart-remove:hover{background:rgba(240,58,55,.12)}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:.82rem}
.cart-total strong{font-size:1.15rem}
.cart-submit{width:100%}
@media(max-width:720px){.sale-layout{grid-template-columns:1fr}.sale-cart{position:static}.sale-entry{padding:0}}


.products-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px;align-items:start}
.products-layout>.panel{min-width:0}
.product-form{position:sticky;top:225px}
.product-form-fields{display:grid;gap:11px}
.product-form .field{min-width:0}
.product-form .field input,.product-form .field select{width:100%}
.product-form .btn{width:100%;margin-top:3px}
@media(max-width:760px){.products-layout{grid-template-columns:1fr}.product-form{position:static;order:-1}}


.catalog-toolbar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.catalog-search{flex:1;min-width:0;position:relative}
.catalog-search span{position:absolute;left:12px;top:5px;color:var(--muted);font-size:20px}
.catalog-search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:.8rem}
.catalog-search input::placeholder{color:var(--muted)}
.catalog-count{flex-shrink:0;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:20px;padding:7px 10px;color:var(--muted);font-size:.72rem}
.product-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product-tile{min-width:0;border:1px solid var(--line);border-radius:10px;padding:13px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.product-tile:hover{transform:translateY(-2px);border-color:rgba(240,58,55,.55);box-shadow:0 7px 18px rgba(0,0,0,.16)}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:7px}
.tile-icon{width:38px;height:38px;border-radius:10px;background:#0b1015;display:grid;place-items:center}
.tile-icon .ic{width:38px;height:38px;margin:0}
.stock-status{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:600;padding:5px 8px;border-radius:20px}
.stock-status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.stock-status.is-ok{color:#7bd4a5;background:rgba(57,168,112,.13)}
.stock-status.is-low{color:#ff8881;background:rgba(240,58,55,.14)}
.tile-info{margin:12px 0 13px}
.tile-category{font-size:.66rem;color:var(--muted)}
.tile-info h3{font-size:.9rem;line-height:1.3;margin:5px 0 0;color:var(--ink)}
.tile-bottom{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile-price-label,.tile-stock span{display:block;font-size:.63rem;color:var(--muted)}
.tile-price{display:block;margin-top:3px;font-size:1rem}
.tile-stock{text-align:right}.tile-stock strong{display:block;font-size:.88rem}
.tile-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px}
.tile-state{font-size:.65rem;color:var(--muted)}
.catalog-empty{grid-column:1/-1;padding:25px 12px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:520px){.product-cards{grid-template-columns:1fr}.catalog-toolbar{align-items:stretch;flex-direction:column}.catalog-count{align-self:flex-start}}


.catalog-filters{display:flex;flex-wrap:wrap;gap:7px;margin:-2px 0 14px}
.filter-chip{border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--muted);padding:6px 10px;font-size:.68rem;transition:all .16s ease}
.filter-chip:hover{border-color:var(--accent);color:var(--ink)}
.filter-chip.active{background:rgba(240,58,55,.14);border-color:rgba(240,58,55,.55);color:var(--danger-ink);font-weight:700}
.filter-chip.stock-filter{margin-left:auto}
.filter-chip.stock-filter span{display:inline-block;margin-left:4px;min-width:16px;text-align:center;border-radius:10px;background:rgba(240,58,55,.16);padding:1px 4px;color:var(--danger-ink)}
.stock-status.is-none{color:#b4b7bd;background:rgba(160,165,175,.13)}
.product-state{display:inline-flex;align-items:center;gap:5px;font-size:.65rem;font-weight:600}
.product-state i{width:6px;height:6px;border-radius:50%;background:currentColor}
.product-state.active{color:#80d4a8}.product-state.inactive{color:var(--muted)}

</style>
</head>

function catIcon(n){
  n=(n||'').toLowerCase();
  let k='pelota';
  if(/paletero|bolso|mochila/.test(n))k='paletero';
  else if(/paleta|pala\b/.test(n))k='paleta';
  else if(/zapat|calzado/.test(n))k='zapatilla';
  else if(/tubo|pelota/.test(n))k='tubo';
  else if(/indument|ropa|remera|short/.test(n))k='remera';
  return '<span class="ic" aria-hidden="true">'+CAT_ICONS[k]+'</span>';
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ console.error('No se pudo guardar', e); } }
function nid(kind){ db.seq[kind]=(db.seq[kind]||0)+1; return db.seq[kind]; }
function money(n){ return '$'+Number(n||0).toLocaleString('es-AR'); }
function byId(arr,id){ return arr.find(x=>x.id===Number(id)); }

const TABS=[
  {id:'dashboard',label:'Inicio'},
  {id:'productos',label:'Productos'},
  {id:'ventas',label:'Ventas'},
  {id:'compras',label:'Compras'},
  {id:'gente',label:'Clientes y vendedores'},
  {id:'catalogos',label:'Zonas y proveedores'},
  {id:'reportes',label:'Reportes'},
];
let active='dashboard';
const nav=document.getElementById('nav');
TABS.forEach(t=>{
  const b=document.createElement('button');
  b.textContent=t.label; b.onclick=()=>{active=t.id; render();};
  b.dataset.id=t.id; nav.appendChild(b);
});
function markNav(){ [...nav.children].forEach(b=>b.classList.toggle('active', b.dataset.id===active)); }

function render(){
  markNav();
  const m=document.getElementById('main');
  m.innerHTML='';
  ({dashboard:renderDashboard, productos:renderProductos, ventas:renderVentas,
    compras:renderCompras, gente:renderGente, catalogos:renderCatalogos, reportes:renderReportes})[active](m);
}

function panel(title){ const d=document.createElement('div'); d.className='panel'; if(title){const h=document.createElement('h2'); h.textContent=title; d.appendChild(h);} return d; }

// ---------- DASHBOARD ----------
function renderDashboard(m){
  const totalStock=db.productos.reduce((s,p)=>s+p.stock,0);
  const bajos=db.productos.filter(p=>p.activo && p.stock<=p.stock_min).length;
  const totalVentas=db.ventas.reduce((s,v)=>s+v.total,0);
  const totalComisiones=db.ventas.reduce((s,v)=>s+v.comision_monto,0);
  const g=document.createElement('div'); g.className='grid2';
  g.innerHTML=`
    <div class="panel"><div class="stat">${db.productos.length}</div><div class="statlabel">Productos activos</div></div>
    <div class="panel"><div class="stat" style="${bajos?'color:var(--danger-ink)':''}">${bajos}</div><div class="statlabel">Con stock bajo</div></div>
    <div class="panel"><div class="stat">${money(totalVentas)}</div><div class="statlabel">Total vendido (histórico)</div></div>
    <div class="panel"><div class="stat">${money(totalComisiones)}</div><div class="statlabel">Comisiones generadas</div></div>
  `;
  m.appendChild(g);
  const p=panel('Últimas ventas');
  const rows=db.ventas.slice(-5).reverse().map(v=>{
    const vend=byId(db.vendedores,v.vendedor); const cli=byId(db.clientes,v.cliente);
    return `<tr><td>#${v.id}</td><td>${vend?vend.nombre:'-'}</td><td>${cli?cli.nombre:'Consumidor final'}</td><td>${money(v.total)}</td></tr>`;
  }).join('') || `<tr><td colspan="4" class="small">Todavía no hay ventas registradas.</td></tr>`;
  p.innerHTML+=`<div class="tablewrap"><table><tr><th>Venta</th><th>Vendedor</th><th>Cliente</th><th>Total</th></tr>${rows}</table></div>`;
  m.appendChild(p);
}

// ---------- PRODUCTOS ----------
let filtroCategoriaCatalogo='todos';
let filtroSoloStockBajo=false;
let busquedaCatalogo='';
function renderProductos(m){
  const layout=document.createElement('div');
  layout.className='products-layout';
  const list=panel('Catálogo');
  const cards=db.productos.map(pr=>{
    const cat=byId(db.categorias,pr.categoria), marca=byId(db.marcas,pr.marca);
    const category=cat?cat.nombre:'Sin categoría', brand=marca?marca.nombre:'Sin marca';
    const low=pr.stock<=pr.stock_min, noStock=pr.stock<=0;
    const stockLabel=noStock?'Sin unidades':low?'Stock bajo':'Stock suficiente';
    const stockClass=noStock?'is-none':low?'is-low':'is-ok';
    const search=(pr.nombre+' '+category+' '+brand).toLowerCase();
    return `<article class="product-tile" data-search="${search}" data-category="${pr.categoria}" data-low="${low}">
      <div class="tile-top"><div class="tile-icon">${catIcon(category)}</div><span class="stock-status ${stockClass}"><i></i>${stockLabel}</span></div>
      <div class="tile-info"><span class="tile-category">${category} · ${brand}</span><h3>${pr.nombre}</h3></div>
      <div class="tile-bottom"><div><span class="tile-price-label">Precio de venta</span><strong class="tile-price">${money(pr.precio)}</strong></div><div class="tile-stock"><strong>${pr.stock}</strong><span>unidades</span></div></div>
      <div class="tile-actions"><span class="product-state ${pr.activo?'active':'inactive'}"><i></i>${pr.activo?'Activo':'Inactivo'}</span><button type="button" class="btn toggle" onclick="toggleProducto(${pr.id})">${pr.activo?'Desactivar':'Activar'}</button></div>
    </article>`;
  }).join('');
  const categoryChips=db.categorias.map(c=>`<button type="button" class="filter-chip" data-category-chip="${c.id}" onclick="setCategoriaCatalogo('${c.id}',this)">${c.nombre}</button>`).join('');
  const lowCount=db.productos.filter(p=>p.stock<=p.stock_min).length;
  list.innerHTML+=`<div class="catalog-toolbar"><label class="catalog-search"><span aria-hidden="true">⌕</span><input id="catalog-search-input" type="search" placeholder="Buscar producto, categoría o marca…" oninput="filtrarCatalogo(this.value)" aria-label="Buscar en el catálogo"></label><span id="catalog-count" class="catalog-count">${db.productos.length} productos</span></div>
    <div class="catalog-filters"><button type="button" class="filter-chip" data-category-chip="todos" onclick="setCategoriaCatalogo('todos',this)">Todos</button>${categoryChips}<button type="button" class="filter-chip stock-filter" id="low-stock-filter" onclick="toggleStockBajo(this)">Stock bajo <span>${lowCount}</span></button></div>
    <div class="product-cards">${cards||'<div class="catalog-empty">Todavía no hay productos en el catálogo.</div>'}</div>
    <div id="catalog-empty-search" class="catalog-empty" style="display:none">No encontramos productos con esos filtros.</div>`;
  const form=panel('Nuevo producto');
  form.classList.add('product-form');
  form.innerHTML+=`<p class="small" style="margin:0 0 14px">Sumá un artículo al catálogo.</p>
    <div class="product-form-fields">
      <div class="field"><label>Nombre</label><input id="pf-nombre" placeholder="Ej. Paleta Control Pro"></div>
      <div class="field"><label>Categoría</label><select id="pf-cat">${db.categorias.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select></div>
      <div class="field"><label>Marca</label><select id="pf-marca">${db.marcas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select></div>
      <div class="field"><label>Precio de venta</label><input id="pf-precio" type="number" min="0" placeholder="0"></div>
      <div class="field"><label>Stock inicial</label><input id="pf-stock" type="number" min="0" value="0"></div>
      <div class="field"><label>Stock mínimo</label><input id="pf-min" type="number" min="0" value="0"></div>
      <button class="btn" onclick="addProducto()">Agregar producto</button>
    </div>`;
  layout.appendChild(list);
  layout.appendChild(form);
  m.appendChild(layout);
  const input=document.getElementById('catalog-search-input');
  input.value=busquedaCatalogo;
  document.querySelectorAll('[data-category-chip]').forEach(button=>button.classList.toggle('active',button.dataset.categoryChip===filtroCategoriaCatalogo));
  const lowButton=document.getElementById('low-stock-filter');
  if(lowButton)lowButton.classList.toggle('active',filtroSoloStockBajo);
  aplicarFiltrosCatalogo();
}
function filtrarCatalogo(query){
  busquedaCatalogo=(query||'').toLocaleLowerCase('es').trim();
  aplicarFiltrosCatalogo();
}
function setCategoriaCatalogo(category){
  filtroCategoriaCatalogo=String(category);
  document.querySelectorAll('[data-category-chip]').forEach(button=>button.classList.toggle('active',button.dataset.categoryChip===filtroCategoriaCatalogo));
  aplicarFiltrosCatalogo();
}
function toggleStockBajo(button){
  filtroSoloStockBajo=!filtroSoloStockBajo;
  button.classList.toggle('active',filtroSoloStockBajo);
  aplicarFiltrosCatalogo();
}
function aplicarFiltrosCatalogo(){
  const cards=[...document.querySelectorAll('.product-tile')];
  let visible=0;
  cards.forEach(card=>{
    const matchSearch=card.dataset.search.includes(busquedaCatalogo);
    const matchCategory=filtroCategoriaCatalogo==='todos'||card.dataset.category===filtroCategoriaCatalogo;
    const matchLow=!filtroSoloStockBajo||card.dataset.low==='true';
    const show=matchSearch&&matchCategory&&matchLow;
    card.style.display=show?'':'none';
    if(show)visible++;
  });
  const count=document.getElementById('catalog-count');
  if(count)count.textContent=visible===cards.length?`${cards.length} productos`:`${visible} de ${cards.length} productos`;
  const empty=document.getElementById('catalog-empty-search');
  if(empty)empty.style.display=cards.length&&!visible?'block':'none';
}
function addProducto(){
  const nombre=document.getElementById('pf-nombre').value.trim();
  if(!nombre){ alert('Ingresá un nombre de producto.'); return; }
  db.productos.push({
    id:nid('prod'), nombre,
    categoria:Number(document.getElementById('pf-cat').value),
    marca:Number(document.getElementById('pf-marca').value),
    precio:Number(document.getElementById('pf-precio').value)||0,
    stock:Number(document.getElementById('pf-stock').value)||0,
    stock_min:Number(document.getElementById('pf-min').value)||0,
    activo:true
  });
  save(); render();
}
function toggleProducto(id){ const pr=byId(db.productos,id); pr.activo=!pr.activo; save(); render(); }

// ---------- GENTE (clientes y vendedores) ----------
function renderGente(m){
  const p1=panel('Nuevo cliente');
  p1.innerHTML+=`<div class="row">
    <div class="field"><label>Nombre y apellido</label><input id="cf-nombre"></div>
    <div class="field"><label>Teléfono</label><input id="cf-tel"></div>
    <button class="btn" onclick="addCliente()">Agregar</button></div>`;
  m.appendChild(p1);
  const l1=panel('Clientes');
  l1.innerHTML+=`<div class="tablewrap"><table><tr><th>Nombre</th><th>Teléfono</th></tr>
    ${db.clientes.map(c=>`<tr><td>${c.nombre}</td><td>${c.telefono||'-'}</td></tr>`).join('') || '<tr><td colspan="2" class="small">Sin clientes cargados.</td></tr>'}</table></div>`;
  m.appendChild(l1);

  const p2=panel('Nuevo vendedor');
  p2.innerHTML+=`<div class="row">
    <div class="field"><label>Nombre y apellido</label><input id="vf-nombre"></div>
    <div class="field"><label>Zona</label><select id="vf-zona">${db.zonas.map(z=>`<option value="${z.id}">${z.nombre}</option>`).join('')}</select></div>
    <div class="field"><label>% Comisión</label><input id="vf-com" type="number" min="0" max="100" value="10"></div>
    <button class="btn" onclick="addVendedor()">Agregar</button></div>`;
  m.appendChild(p2);
  const l2=panel('Vendedores');
  l2.innerHTML+=`<div class="tablewrap"><table><tr><th>Nombre</th><th>Zona</th><th>Comisión</th></tr>
    ${db.vendedores.map(v=>`<tr><td>${v.nombre}</td><td>${byId(db.zonas,v.zona)?.nombre||''}</td><td>${v.comision}%</td></tr>`).join('') || '<tr><td colspan="3" class="small">Sin vendedores cargados.</td></tr>'}</table></div>`;
  m.appendChild(l2);
}
function addCliente(){
  const nombre=document.getElementById('cf-nombre').value.trim();
  if(!nombre){ alert('Ingresá el nombre del cliente.'); return; }
  db.clientes.push({id:nid('cli'), nombre, telefono:document.getElementById('cf-tel').value.trim()});
  save(); render();
}
function addVendedor(){
  const nombre=document.getElementById('vf-nombre').value.trim();
  if(!nombre){ alert('Ingresá el nombre del vendedor.'); return; }
  db.vendedores.push({id:nid('vend'), nombre, zona:Number(document.getElementById('vf-zona').value), comision:Number(document.getElementById('vf-com').value)||0});
  save(); render();
}

// ---------- CATALOGOS (zonas, proveedores, categorías, marcas) ----------
function simpleCrud(m, title, arr, fields){
  const p=panel(title);
  const inputs=fields.map(f=>`<div class="field"><label>${f.label}</label><input id="sc-${title}-${f.key}"></div>`).join('');
  p.innerHTML+=`<div class="row">${inputs}<button class="btn" onclick="addSimple('${title}')">Agregar</button></div>
    <div class="tablewrap"><table><tr>${fields.map(f=>`<th>${f.label}</th>`).join('')}</tr>
    ${arr.map(x=>`<tr>${fields.map(f=>`<td>${x[f.key]||'-'}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${fields.length}" class="small">Sin registros.</td></tr>`}</table></div>`;
  m.appendChild(p);
}
const SIMPLE_MAP={};
function renderCatalogos(m){
  SIMPLE_MAP['Zonas']={arr:db.zonas, seq:'zona', fields:[{key:'nombre',label:'Nombre'}]};
  SIMPLE_MAP['Proveedores']={arr:db.proveedores, seq:'prov', fields:[{key:'nombre',label:'Nombre'},{key:'telefono',label:'Teléfono'}]};
  SIMPLE_MAP['Categorías']={arr:db.categorias, seq:'cat', fields:[{key:'nombre',label:'Nombre'}]};
  SIMPLE_MAP['Marcas']={arr:db.marcas, seq:'marca', fields:[{key:'nombre',label:'Nombre'}]};
  simpleCrud(m,'Zonas',db.zonas,SIMPLE_MAP['Zonas'].fields);
  simpleCrud(m,'Proveedores',db.proveedores,SIMPLE_MAP['Proveedores'].fields);
  simpleCrud(m,'Categorías',db.categorias,SIMPLE_MAP['Categorías'].fields);
  simpleCrud(m,'Marcas',db.marcas,SIMPLE_MAP['Marcas'].fields);
}
function addSimple(title){
  const conf=SIMPLE_MAP[title];
  const obj={id:nid(conf.seq)};
  let ok=true;
  conf.fields.forEach(f=>{ const v=document.getElementById(`sc-${title}-${f.key}`).value.trim(); if(f.key==='nombre' && !v) ok=false; obj[f.key]=v; });
  if(!ok){ alert('Ingresá al menos el nombre.'); return; }
  conf.arr.push(obj); save(); render();
}

// ---------- VENTAS ----------
let ventaLineas=[];
function renderVentas(m){
  const p=panel('Registrar venta');
  p.innerHTML+=`<div class="sale-layout">
    <div class="sale-entry">
      <div class="row">
        <div class="field"><label>Vendedor</label><select id="vt-vend">${db.vendedores.map(v=>`<option value="${v.id}">${v.nombre}</option>`).join('') || '<option value="">Cargá un vendedor primero</option>'}</select></div>
        <div class="field"><label>Cliente (opcional)</label><select id="vt-cli"><option value="">Consumidor final</option>${db.clientes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select></div>
      </div>
      <div class="row" style="margin-top:16px">
        <div class="field"><label>Producto</label><select id="vt-prod">${db.productos.filter(p=>p.activo).map(p=>`<option value="${p.id}">${p.nombre} (stock ${p.stock})</option>`).join('')}</select></div>
        <div class="field" style="max-width:130px"><label>Cantidad</label><input id="vt-cant" type="number" min="1" value="1"></div>
        <button class="btn ghost" onclick="addLineaVenta()">＋ Agregar producto</button>
      </div>
      <p class="small" style="margin-top:18px">Seleccioná productos y cantidades. El stock se descuenta al registrar la venta.</p>
    </div>
    <aside class="sale-cart">
      <div class="cart-heading"><h3>Tu carrito</h3><span id="vt-count" class="pill">0 productos</span></div>
      <div id="vt-lineas" class="cart-lines"></div>
      <div class="cart-total"><span>Total</span><strong id="vt-total">$0</strong></div>
      <button class="btn cart-submit" onclick="confirmarVenta()">Registrar venta</button>
    </aside>
  </div>`;
  m.appendChild(p);
  pintarLineasVenta();
  const hist=panel('Historial de ventas');
  hist.innerHTML+=`<div class="tablewrap"><table><tr><th>#</th><th>Vendedor</th><th>Cliente</th><th>Total</th><th>Comisión</th></tr>
  ${db.ventas.slice().reverse().map(v=>`<tr><td>${v.id}</td><td>${byId(db.vendedores,v.vendedor)?.nombre||'-'}</td><td>${byId(db.clientes,v.cliente)?.nombre||'Consumidor final'}</td><td>${money(v.total)}</td><td>${money(v.comision_monto)}</td></tr>`).join('') || '<tr><td colspan="5" class="small">Sin ventas.</td></tr>'}</table></div>`;
  m.appendChild(hist);
}
function pintarLineasVenta(){
  const box=document.getElementById('vt-lineas');
  if(!box) return;
  const count=ventaLineas.reduce((sum,l)=>sum+l.cantidad,0);
  document.getElementById('vt-count').textContent=`${count} ${count===1?'producto':'productos'}`;
  const total=ventaLineas.reduce((sum,l)=>sum+byId(db.productos,l.producto).precio*l.cantidad,0);
  document.getElementById('vt-total').textContent=money(total);
  if(!ventaLineas.length){ box.innerHTML='<div class="cart-empty">Tu carrito está vacío.<br><span>Agregá productos para comenzar.</span></div>'; return; }
  box.innerHTML=ventaLineas.map((l,i)=>{
    const pr=byId(db.productos,l.producto);
    return `<div class="cart-item"><div class="cart-product"><strong>${pr.nombre}</strong><span>${l.cantidad} × ${money(pr.precio)}</span></div><div class="cart-price">${money(pr.precio*l.cantidad)}</div><button type="button" class="cart-remove" aria-label="Quitar ${pr.nombre}" onclick="quitarLineaVenta(${i})">×</button></div>`;
  }).join('');
}
function addLineaVenta(){
  const prodId=Number(document.getElementById('vt-prod').value);
  const cant=Number(document.getElementById('vt-cant').value)||0;
  const pr=byId(db.productos,prodId);
  if(!pr || cant<=0){ alert('Elegí un producto y una cantidad válida.'); return; }
  const yaEnCarrito=ventaLineas.filter(l=>l.producto===prodId).reduce((s,l)=>s+l.cantidad,0);
  if(yaEnCarrito+cant>pr.stock){ alert(`No hay stock suficiente de ${pr.nombre}. Disponible: ${pr.stock}.`); return; }
  ventaLineas.push({producto:prodId, cantidad:cant});
  pintarLineasVenta();
}
function quitarLineaVenta(i){ ventaLineas.splice(i,1); pintarLineasVenta(); }
function confirmarVenta(){
  const vendId=Number(document.getElementById('vt-vend').value);
  const vend=byId(db.vendedores,vendId);
  if(!vend){ alert('Cargá un vendedor antes de registrar la venta.'); return; }
  if(!ventaLineas.length){ alert('Agregá al menos un producto.'); return; }
  const cliVal=document.getElementById('vt-cli').value;
  let total=0;
  const detalle=ventaLineas.map(l=>{
    const pr=byId(db.productos,l.producto);
    const subtotal=pr.precio*l.cantidad;
    total+=subtotal;
    return {producto:pr.id, cantidad:l.cantidad, precio_unitario:pr.precio, subtotal};
  });
  detalle.forEach(d=>{ byId(db.productos,d.producto).stock-=d.cantidad; });
  const comision_monto=Math.round(total*(vend.comision/100));
  db.ventas.push({id:nid('venta'), vendedor:vendId, cliente:cliVal?Number(cliVal):null, fecha:new Date().toISOString(), detalle, total, comision_pct:vend.comision, comision_monto});
  ventaLineas=[]; save(); render();
}

// ---------- COMPRAS ----------
let compraLineas=[];
function renderCompras(m){
  const p=panel('Registrar compra');
  p.innerHTML+=`<div class="row">
    <div class="field"><label>Proveedor</label><select id="cp-prov">${db.proveedores.map(pv=>`<option value="${pv.id}">${pv.nombre}</option>`).join('') || '<option value="">Cargá un proveedor primero</option>'}</select></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="field"><label>Producto</label><select id="cp-prod">${db.productos.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('')}</select></div>
    <div class="field"><label>Cantidad</label><input id="cp-cant" type="number" min="1" value="1"></div>
    <div class="field"><label>Precio unitario</label><input id="cp-precio" type="number" min="0"></div>
    <button class="btn ghost" onclick="addLineaCompra()">Agregar línea</button>
  </div>
  <div id="cp-lineas" style="margin-top:10px"></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="confirmarCompra()">Registrar compra</button></div>`;
  m.appendChild(p);
  pintarLineasCompra();
  const hist=panel('Historial de compras');
  hist.innerHTML+=`<div class="tablewrap"><table><tr><th>#</th><th>Proveedor</th><th>Total</th></tr>
  ${db.compras.slice().reverse().map(c=>`<tr><td>${c.id}</td><td>${byId(db.proveedores,c.proveedor)?.nombre||'-'}</td><td>${money(c.total)}</td></tr>`).join('') || '<tr><td colspan="3" class="small">Sin compras.</td></tr>'}</table></div>`;
  m.appendChild(hist);
}
function pintarLineasCompra(){
  const box=document.getElementById('cp-lineas');
  if(!box) return;
  if(!compraLineas.length){ box.innerHTML='<div class="small">Todavía no agregaste productos a esta compra.</div>'; return; }
  box.innerHTML=compraLineas.map((l,i)=>{
    const pr=byId(db.productos,l.producto);
    return `<div class="detail-row">${pr.nombre} × ${l.cantidad} — ${money(l.precio*l.cantidad)} <a class="link" onclick="quitarLineaCompra(${i})">Quitar</a></div>`;
  }).join('');
}
function addLineaCompra(){
  const prodId=Number(document.getElementById('cp-prod').value);
  const cant=Number(document.getElementById('cp-cant').value)||0;
  const precio=Number(document.getElementById('cp-precio').value)||0;
  if(!prodId || cant<=0){ alert('Elegí un producto y una cantidad válida.'); return; }
  compraLineas.push({producto:prodId, cantidad:cant, precio});
  pintarLineasCompra();
}
function quitarLineaCompra(i){ compraLineas.splice(i,1); pintarLineasCompra(); }
function confirmarCompra(){
  const provId=Number(document.getElementById('cp-prov').value);
  if(!provId){ alert('Cargá un proveedor antes de registrar la compra.'); return; }
  if(!compraLineas.length){ alert('Agregá al menos un producto.'); return; }
  let total=0;
  const detalle=compraLineas.map(l=>{ const subtotal=l.precio*l.cantidad; total+=subtotal; return {producto:l.producto, cantidad:l.cantidad, precio_unitario:l.precio, subtotal}; });
  detalle.forEach(d=>{ byId(db.productos,d.producto).stock+=d.cantidad; });
  db.compras.push({id:nid('compra'), proveedor:provId, fecha:new Date().toISOString(), detalle, total});
  compraLineas=[]; save(); render();
}

// ---------- REPORTES ----------
function renderReportes(m){
  const bajos=db.productos.filter(p=>p.activo && p.stock<=p.stock_min);
  const p1=panel('Stock bajo mínimo');
  p1.innerHTML+=`<div class="tablewrap"><table><tr><th>Producto</th><th>Stock</th><th>Mínimo</th></tr>
  ${bajos.map(p=>`<tr><td>${p.nombre}</td><td>${p.stock}</td><td>${p.stock_min}</td></tr>`).join('') || '<tr><td colspan="3" class="small">Ningún producto por debajo del mínimo.</td></tr>'}</table></div>`;
  m.appendChild(p1);

  const porVend={};
  db.ventas.forEach(v=>{ porVend[v.vendedor]=porVend[v.vendedor]||{total:0,comision:0}; porVend[v.vendedor].total+=v.total; porVend[v.vendedor].comision+=v.comision_monto; });
  const p2=panel('Ventas y comisiones por vendedor');
  p2.innerHTML+=`<div class="tablewrap"><table><tr><th>Vendedor</th><th>Total vendido</th><th>Comisión</th></tr>
  ${Object.keys(porVend).map(id=>`<tr><td>${byId(db.vendedores,id)?.nombre||'-'}</td><td>${money(porVend[id].total)}</td><td>${money(porVend[id].comision)}</td></tr>`).join('') || '<tr><td colspan="3" class="small">Sin ventas registradas todavía.</td></tr>'}</table></div>`;
  m.appendChild(p2);

  const unidades={};
  db.ventas.forEach(v=>v.detalle.forEach(d=>{ unidades[d.producto]=(unidades[d.producto]||0)+d.cantidad; }));
  const ranking=Object.entries(unidades).sort((a,b)=>b[1]-a[1]);
  const p3=panel('Productos más vendidos');
  p3.innerHTML+=`<div class="tablewrap"><table><tr><th>Producto</th><th>Unidades vendidas</th></tr>
  ${ranking.map(([id,u])=>`<tr><td>${byId(db.productos,id)?.nombre||'-'}</td><td>${u}</td></tr>`).join('') || '<tr><td colspan="2" class="small">Sin ventas registradas todavía.</td></tr>'}</table></div>`;
  m.appendChild(p3);
}

render();
</script>
</body>
</html>
